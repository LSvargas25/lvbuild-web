name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Type check
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Test and coverage summary
        if: always()
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          if (fs.existsSync('test-results.xml')) {
            const xml = fs.readFileSync('test-results.xml', 'utf8')
            const tag = (xml.match(/<testsuites[^>]*>/) || [''])[0]
            const attr = (name) => Number((tag.match(new RegExp(` ${name}="([0-9]+)"`)) || [])[1] || 0)
            const total = attr('tests'), failed = attr('failures') + attr('errors'), skipped = attr('skipped')
            console.log(`### ${failed ? ':x:' : ':white_check_mark:'} Tests\n`)
            console.log('| Total | Passed | Failed | Skipped |\n|---|---|---|---|')
            console.log(`| ${total} | ${total - failed - skipped} | ${failed} | ${skipped} |\n`)
          }
          if (fs.existsSync('coverage/coverage-summary.json')) {
            const { total } = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'))
            console.log('### Coverage\n\n| Lines | Statements | Functions | Branches |\n|---|---|---|---|')
            const pct = (k) => `${total[k].pct} %`
            console.log(`| ${pct('lines')} | ${pct('statements')} | ${pct('functions')} | ${pct('branches')} |`)
          }
          JS

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api

      - name: Check entry chunk size
        run: |
          entry=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | sed -E 's/src="\/(.*)"/\1/')
          size=$(wc -c < "dist/$entry")
          echo "Entry chunk $entry: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 300000 || { echo "Entry chunk is over 300 kB"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
